<section class="hero" style="padding: 8rem 0;">
  <div class="container" style="max-width: 600px; text-align: center;">
    <div class="card reveal" style="padding: 3.5rem 2rem;">
      <p class="eyebrow" style="margin-bottom: 1.25rem;">Next Milestone</p>
      <h2 style="font-family: var(--font-heading); font-size: 2.25rem; margin-bottom: 0.75rem;">Coming Soon</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">This page is a placeholder layout designed for launch count downs. All timings and features are mock values.</p>

      <!-- Mock Countdown display -->
      <div style="display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem;" aria-label="Mock countdown timer">
        <div>
          <strong style="display: block; font-size: 2rem; color: var(--accent-cyan); line-height: 1;">30</strong>
          <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Days</span>
        </div>
        <div style="font-size: 2rem; color: var(--border-color);">:</div>
        <div>
          <strong style="display: block; font-size: 2rem; color: var(--accent-cyan); line-height: 1;">12</strong>
          <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Hours</span>
        </div>
        <div style="font-size: 2rem; color: var(--border-color);">:</div>
        <div>
          <strong style="display: block; font-size: 2rem; color: var(--accent-cyan); line-height: 1;">45</strong>
          <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Mins</span>
        </div>
      </div>

      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.50rem;">Get notified when we launch (Mock Sign Up):</p>
      <form class="newsletter-form" id="coming-soon-form" novalidate>
        <div class="newsletter-input-group" style="max-width: 420px; margin: 0 auto;">
          <input type="email" placeholder="you@example.com" class="form-control" style="border-radius: var(--radius-full);" required />
          <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1.5rem; min-height: auto;">Subscribe</button>
        </div>
        <p class="newsletter-status" style="margin-top: 0.5rem; font-size: 0.8rem;"></p>
      </form>
    </div>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('coming-soon-form');
    if (!form) return;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = form.querySelector('input');
      const status = form.querySelector('.newsletter-status');
      if (input.value.includes('@')) {
        status.className = 'newsletter-status success';
        status.textContent = 'Thanks! (Demo signup complete)';
        input.value = '';
      } else {
        status.className = 'newsletter-status error';
        status.textContent = 'Invalid email syntax.';
      }
    });
  });
</script>
